<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jahreskalender</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #6b7280;
    --line: #e2e5ea;
    --weekend: #eef0f4;
    --today: #e11d48;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Kopfzeile */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 1.6rem; font-weight: 700; min-width: 4ch; text-align: center; }
  .legend { display: flex; gap: 14px; margin-left: 12px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .spacer { flex: 1; }
  button {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { background: var(--weekend); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.1); }
  button.danger { color: #b91c1c; border-color: #fca5a5; }

  /* Kalender-Raster: 12 Monate x 3 Personen, Spalten = Tage 1..31 */
  main { flex: 1; min-height: 0; padding: 8px 12px 12px; display: flex; }
  #calendar {
    flex: 1;
    display: grid;
    grid-template-columns: 4.2rem 5.5rem repeat(31, minmax(0, 1fr));
    grid-auto-rows: minmax(0, 1fr);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    font-size: clamp(9px, 1.15vh, 14px);
  }
  .hd {
    font-weight: 700;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 2px solid var(--line);
  }
  .month {
    grid-column: 1;
    font-weight: 700;
    display: flex;
    align-items: center;
    padding-left: 8px;
    border-bottom: 2px solid #c9ced6;
    font-size: 1.15em;
  }
  .person {
    grid-column: 2;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 6px;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
    white-space: nowrap;
    overflow: hidden;
    color: var(--muted);
  }
  .person i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .person.last, .day.last { border-bottom: 2px solid #c9ced6; }
  .day {
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
    cursor: pointer;
    position: relative;
  }
  .day:hover { background: #dbeafe !important; }
  .day.weekend { background: var(--weekend); }
  .day.invalid { background: repeating-linear-gradient(45deg, #f3f4f6, #f3f4f6 3px, #e5e7eb 3px, #e5e7eb 6px); cursor: default; }
  .day.today { box-shadow: inset 0 0 0 2px var(--today); }
  .wd {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8em;
    color: var(--muted);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: #fafbfc;
    line-height: 1;
  }
  .wd.weekend { background: var(--weekend); color: var(--text); font-weight: 700; }
  .wd.today { background: var(--today); color: #fff; font-weight: 700; }
  .wd.invalid { background: repeating-linear-gradient(45deg, #f3f4f6, #f3f4f6 3px, #e5e7eb 3px, #e5e7eb 6px); }

  .bar {
    z-index: 2;
    margin: 1px 0;
    border-radius: 4px;
    color: #fff;
    font-weight: 600;
    font-size: 0.95em;
    padding: 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    display: flex;
    align-items: center;
    min-height: 0;
    box-shadow: 0 1px 1px rgba(0,0,0,.15);
  }
  .bar:hover { filter: brightness(1.1); outline: 2px solid rgba(0,0,0,.35); }
  .bar.cont-left { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .bar.cont-right { border-top-right-radius: 0; border-bottom-right-radius: 0; }

  /* Dialoge */
  dialog {
    border: none;
    border-radius: 10px;
    padding: 20px 22px;
    width: min(440px, calc(100vw - 32px));
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
    color: var(--text);
  }
  dialog::backdrop { background: rgba(15, 23, 42, .45); }
  dialog h2 { margin: 0 0 14px; font-size: 1.25rem; }
  form .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  form .row.inline { flex-direction: row; gap: 12px; }
  form .row.inline > div { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  label.cap { font-size: .85rem; font-weight: 600; color: var(--muted); }
  input[type=text], input[type=date] {
    font: inherit;
    padding: 7px 9px;
    border: 1px solid #cbd0d8;
    border-radius: 6px;
    width: 100%;
  }
  .persons { display: flex; gap: 14px; flex-wrap: wrap; }
  .persons label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .swatch {
    width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
    border: 2px solid transparent; padding: 0;
  }
  .swatch.sel { border-color: var(--text); box-shadow: 0 0 0 2px #fff inset; }
  input[type=color] { width: 36px; height: 30px; border: none; padding: 0; background: none; cursor: pointer; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .actions .left { margin-right: auto; }
  .err { color: #b91c1c; font-size: .9rem; min-height: 1.2em; }
  .settings-person { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
</style>
</head>
<body>

<header>
  <button id="prevYear" title="Vorheriges Jahr">◀</button>
  <h1 id="yearLabel"></h1>
  <button id="nextYear" title="Nächstes Jahr">▶</button>
  <button id="todayBtn">Heute</button>
  <div class="legend" id="legend"></div>
  <div class="spacer"></div>
  <button class="primary" id="addBtn">+ Eintrag</button>
  <button id="settingsBtn">Einstellungen</button>
  <button id="fullscreenBtn" title="Vollbild">⛶</button>
</header>

<main><div id="calendar"></div></main>

<!-- Eintrag anlegen / bearbeiten -->
<dialog id="entryDialog">
  <form id="entryForm" method="dialog">
    <h2 id="entryTitle">Neuer Eintrag</h2>
    <div class="row">
      <label class="cap" for="fLabel">Bezeichnung</label>
      <input type="text" id="fLabel" maxlength="60" placeholder="z. B. Urlaub, Kur, Schulung" required>
    </div>
    <div class="row inline">
      <div>
        <label class="cap" for="fFrom">Von</label>
        <input type="date" id="fFrom" required>
      </div>
      <div>
        <label class="cap" for="fTo">Bis</label>
        <input type="date" id="fTo" required>
      </div>
    </div>
    <div class="row">
      <span class="cap">Person(en)</span>
      <div class="persons" id="fPersons"></div>
    </div>
    <div class="row">
      <span class="cap">Farbe</span>
      <div class="swatches" id="fSwatches"></div>
    </div>
    <div class="err" id="fError"></div>
    <div class="actions">
      <button type="button" class="danger left" id="deleteBtn">Löschen</button>
      <button type="button" id="cancelBtn">Abbrechen</button>
      <button type="submit" class="primary">Speichern</button>
    </div>
  </form>
</dialog>

<!-- Einstellungen -->
<dialog id="settingsDialog">
  <form id="settingsForm" method="dialog">
    <h2>Einstellungen</h2>
    <div class="row">
      <span class="cap">Personen</span>
      <div id="sPersons"></div>
    </div>
    <div class="row">
      <span class="cap">Daten sichern / übertragen</span>
      <div class="swatches">
        <button type="button" id="exportBtn">Exportieren (JSON)</button>
        <button type="button" id="importBtn">Importieren</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="sCancelBtn">Abbrechen</button>
      <button type="submit" class="primary">Speichern</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'jahreskalender.v1';
  const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli',
                  'August', 'September', 'Oktober', 'November', 'Dezember'];
  const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const PALETTE = ['#2563eb', '#16a34a', '#dc2626', '#ea580c', '#9333ea',
                   '#0891b2', '#db2777', '#ca8a04', '#4b5563', '#065f46'];

  const DEFAULT_STATE = {
    persons: [
      { id: 'p1', name: 'Person 1', color: '#2563eb' },
      { id: 'p2', name: 'Person 2', color: '#16a34a' },
      { id: 'p3', name: 'Person 3', color: '#dc2626' },
    ],
    entries: [],
  };

  // ---------- Speicher ----------
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (Array.isArray(s.persons) && s.persons.length === 3 && Array.isArray(s.entries)) return s;
      }
    } catch (e) { /* ignorieren, Standard verwenden */ }
    return structuredClone(DEFAULT_STATE);
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* nicht verfügbar */ }
  }

  let state = load();
  let year = new Date().getFullYear();

  // ---------- Datum-Helfer (lokale Zeit, Format YYYY-MM-DD) ----------
  const pad = n => String(n).padStart(2, '0');
  const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
  const todayIso = () => { const t = new Date(); return iso(t.getFullYear(), t.getMonth(), t.getDate()); };
  const fmt = s => { const [y, m, d] = s.split('-'); return `${d}.${m}.${y}`; };

  // ---------- Rendering ----------
  const cal = document.getElementById('calendar');

  function el(tag, cls, style) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (style) Object.assign(e.style, style);
    return e;
  }

  function render() {
    document.getElementById('yearLabel').textContent = year;
    renderLegend();
    cal.replaceChildren();
    const today = todayIso();

    // Grid: Zeile 1 = Kopf, danach pro Monat eine Wochentag-Zeile und 3 Zeilen (eine je Person)
    cal.style.gridTemplateRows = `minmax(1.6em, auto) repeat(12, 1.4em repeat(3, minmax(0, 1fr)))`;

    cal.appendChild(el('div', 'hd', { gridColumn: '1 / 3', gridRow: 1 }));
    for (let d = 1; d <= 31; d++) {
      const h = el('div', 'hd', { gridColumn: d + 2, gridRow: 1 });
      h.textContent = d;
      cal.appendChild(h);
    }

    for (let m = 0; m < 12; m++) {
      const wdRow = 2 + m * 4;
      const baseRow = wdRow + 1;
      const mEl = el('div', 'month', { gridRow: `${wdRow} / span 4` });
      mEl.textContent = MONTHS[m].slice(0, 3);
      mEl.title = MONTHS[m];
      cal.appendChild(mEl);
      const dim = daysInMonth(year, m);

      cal.appendChild(el('div', 'wd', { gridColumn: 2, gridRow: wdRow }));
      for (let d = 1; d <= 31; d++) {
        const w = el('div', 'wd', { gridColumn: d + 2, gridRow: wdRow });
        if (d > dim) {
          w.classList.add('invalid');
        } else {
          const wd = new Date(year, m, d).getDay();
          w.textContent = WEEKDAYS[wd];
          w.title = `${WEEKDAYS[wd]}, ${pad(d)}.${pad(m + 1)}.${year}`;
          if (wd === 0 || wd === 6) w.classList.add('weekend');
          if (iso(year, m, d) === today) w.classList.add('today');
        }
        cal.appendChild(w);
      }

      state.persons.forEach((p, pi) => {
        const row = baseRow + pi;
        const last = pi === 2 ? ' last' : '';
        const pEl = el('div', 'person' + last, { gridRow: row });
        const dot = el('i', null, { background: p.color });
        pEl.append(dot, document.createTextNode(p.name));
        pEl.title = p.name;
        cal.appendChild(pEl);

        for (let d = 1; d <= 31; d++) {
          const c = el('div', 'day' + last, { gridColumn: d + 2, gridRow: row });
          if (d > dim) {
            c.classList.add('invalid');
          } else {
            const date = iso(year, m, d);
            const wd = new Date(year, m, d).getDay();
            if (wd === 0 || wd === 6) c.classList.add('weekend');
            if (date === today) c.classList.add('today');
            c.addEventListener('click', () => openEntry(null, { from: date, to: date, persons: [p.id] }));
          }
          cal.appendChild(c);
        }
        renderBars(m, dim, p, row);
      });
    }
  }

  // Balken einer Person in einem Monat; überlappende Einträge werden in Spuren gestapelt.
  function renderBars(m, dim, person, row) {
    const mStart = iso(year, m, 1), mEnd = iso(year, m, dim);
    const items = state.entries
      .filter(e => e.persons.includes(person.id) && e.from <= mEnd && e.to >= mStart)
      .sort((a, b) => a.from.localeCompare(b.from) || b.to.localeCompare(a.to));
    if (!items.length) return;

    const lanes = []; // je Spur: letzter belegter Tag
    const placed = items.map(e => {
      const s = e.from < mStart ? 1 : +e.from.slice(8);
      const t = e.to > mEnd ? dim : +e.to.slice(8);
      let lane = lanes.findIndex(endDay => endDay < s);
      if (lane === -1) { lane = lanes.length; lanes.push(t); } else lanes[lane] = t;
      return { e, s, t, lane, contL: e.from < mStart, contR: e.to > mEnd };
    });
    const n = lanes.length;

    placed.forEach(({ e, s, t, lane, contL, contR }) => {
      const b = el('div', 'bar', {
        gridColumn: `${s + 2} / ${t + 3}`,
        gridRow: row,
        background: e.color,
        color: textColorFor(e.color),
        alignSelf: 'start',
        height: `calc(${100 / n}% - 2px)`,
        // Spur-Versatz relativ zur eigenen Balkenhöhe
        transform: `translateY(calc(${lane * 100}% + ${lane * 2}px))`,
      });
      if (contL) b.classList.add('cont-left');
      if (contR) b.classList.add('cont-right');
      b.textContent = e.label;
      const names = e.persons.map(id => personById(id)?.name).filter(Boolean).join(', ');
      b.title = `${e.label}\n${fmt(e.from)} – ${fmt(e.to)}\n${names}`;
      b.addEventListener('click', ev => { ev.stopPropagation(); openEntry(e); });
      cal.appendChild(b);
    });
  }

  function renderLegend() {
    const lg = document.getElementById('legend');
    lg.replaceChildren(...state.persons.map(p => {
      const s = el('span');
      s.append(el('i', null, { background: p.color }), document.createTextNode(p.name));
      return s;
    }));
  }

  function textColorFor(hex) {
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? '#111827' : '#ffffff';
  }
  const personById = id => state.persons.find(p => p.id === id);

  // ---------- Eintrag-Dialog ----------
  const dlg = document.getElementById('entryDialog');
  const fLabel = document.getElementById('fLabel');
  const fFrom = document.getElementById('fFrom');
  const fTo = document.getElementById('fTo');
  const fPersons = document.getElementById('fPersons');
  const fSwatches = document.getElementById('fSwatches');
  const fError = document.getElementById('fError');
  let editing = null;
  let selColor = PALETTE[0];

  function renderSwatches() {
    fSwatches.replaceChildren();
    PALETTE.forEach(c => {
      const b = el('button', 'swatch' + (c === selColor ? ' sel' : ''), { background: c });
      b.type = 'button';
      b.title = c;
      b.addEventListener('click', () => { selColor = c; renderSwatches(); });
      fSwatches.appendChild(b);
    });
    const custom = el('input');
    custom.type = 'color';
    custom.value = selColor;
    custom.title = 'Eigene Farbe';
    custom.addEventListener('input', () => { selColor = custom.value; });
    custom.addEventListener('change', renderSwatches);
    fSwatches.appendChild(custom);
  }

  function openEntry(entry, preset = {}) {
    editing = entry;
    const src = entry || preset;
    document.getElementById('entryTitle').textContent = entry ? 'Eintrag bearbeiten' : 'Neuer Eintrag';
    document.getElementById('deleteBtn').style.display = entry ? '' : 'none';
    fLabel.value = src.label || '';
    fFrom.value = src.from || todayIso();
    fTo.value = src.to || src.from || todayIso();
    selColor = src.color || personById((src.persons || [])[0])?.color || PALETTE[0];
    fPersons.replaceChildren(...state.persons.map(p => {
      const l = el('label');
      const cb = el('input');
      cb.type = 'checkbox';
      cb.value = p.id;
      cb.checked = (src.persons || []).includes(p.id);
      l.append(cb, el('i', null, { width: '10px', height: '10px', borderRadius: '50%', background: p.color, display: 'inline-block' }), document.createTextNode(p.name));
      return l;
    }));
    fError.textContent = '';
    renderSwatches();
    dlg.showModal();
    fLabel.focus();
  }

  fFrom.addEventListener('change', () => { if (!fTo.value || fTo.value < fFrom.value) fTo.value = fFrom.value; });

  document.getElementById('entryForm').addEventListener('submit', ev => {
    const persons = [...fPersons.querySelectorAll('input:checked')].map(c => c.value);
    const label = fLabel.value.trim();
    let err = '';
    if (!label) err = 'Bitte eine Bezeichnung eingeben.';
    else if (!fFrom.value || !fTo.value) err = 'Bitte Von- und Bis-Datum angeben.';
    else if (fTo.value < fFrom.value) err = '„Bis“ darf nicht vor „Von“ liegen.';
    else if (!persons.length) err = 'Bitte mindestens eine Person auswählen.';
    if (err) { ev.preventDefault(); fError.textContent = err; return; }

    const data = { label, from: fFrom.value, to: fTo.value, persons, color: selColor };
    if (editing) Object.assign(editing, data);
    else state.entries.push({ id: 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ...data });
    save();
    render();
  });
  document.getElementById('cancelBtn').addEventListener('click', () => dlg.close());
  document.getElementById('deleteBtn').addEventListener('click', () => {
    if (editing && confirm(`„${editing.label}“ wirklich löschen?`)) {
      state.entries = state.entries.filter(e => e !== editing);
      save();
      render();
      dlg.close();
    }
  });

  // ---------- Einstellungen ----------
  const sDlg = document.getElementById('settingsDialog');
  const sPersons = document.getElementById('sPersons');

  document.getElementById('settingsBtn').addEventListener('click', () => {
    sPersons.replaceChildren(...state.persons.map(p => {
      const row = el('div', 'settings-person');
      const c = el('input'); c.type = 'color'; c.value = p.color; c.dataset.id = p.id; c.dataset.k = 'color';
      const n = el('input'); n.type = 'text'; n.value = p.name; n.maxLength = 20; n.dataset.id = p.id; n.dataset.k = 'name';
      row.append(c, n);
      return row;
    }));
    sDlg.showModal();
  });
  document.getElementById('settingsForm').addEventListener('submit', () => {
    sPersons.querySelectorAll('input').forEach(i => {
      const p = personById(i.dataset.id);
      const v = i.value.trim();
      if (p && v) p[i.dataset.k] = v;
    });
    save();
    render();
  });
  document.getElementById('sCancelBtn').addEventListener('click', () => sDlg.close());

  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = el('a');
    a.href = URL.createObjectURL(blob);
    a.download = `jahreskalender-${todayIso()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  const importFile = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', async () => {
    const file = importFile.files[0];
    if (!file) return;
    try {
      const s = JSON.parse(await file.text());
      if (!Array.isArray(s.persons) || s.persons.length !== 3 || !Array.isArray(s.entries)) throw new Error();
      if (!confirm('Aktuelle Daten durch die importierte Datei ersetzen?')) return;
      state = s;
      save();
      render();
      sDlg.close();
    } catch (e) {
      alert('Die Datei ist kein gültiger Kalender-Export.');
    } finally {
      importFile.value = '';
    }
  });

  // ---------- Kopfzeile ----------
  document.getElementById('prevYear').addEventListener('click', () => { year--; render(); });
  document.getElementById('nextYear').addEventListener('click', () => { year++; render(); });
  document.getElementById('todayBtn').addEventListener('click', () => { year = new Date().getFullYear(); render(); });
  document.getElementById('addBtn').addEventListener('click', () => openEntry(null, { persons: [] }));
  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  });

  // Tageswechsel (Monitor läuft dauerhaft): Heute-Markierung aktualisieren
  let lastDay = todayIso();
  setInterval(() => {
    const t = todayIso();
    if (t !== lastDay) {
      if (year === +lastDay.slice(0, 4)) year = +t.slice(0, 4);
      lastDay = t;
      render();
    }
  }, 60 * 1000);

  // Änderungen aus einem anderen Tab übernehmen
  window.addEventListener('storage', e => { if (e.key === STORAGE_KEY) { state = load(); render(); } });

  render();
})();
</script>
</body>
</html>
